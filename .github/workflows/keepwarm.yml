# Keeps the public demo warm and checks it is up. Does nothing until the repo variable DEMO_URL is set
# (Settings > Secrets and variables > Actions > Variables), for example https://till-nebius.onrender.com
name: keep demo warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    if: ${{ vars.DEMO_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.DEMO_URL }}/agent/status"
